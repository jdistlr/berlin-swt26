name: Build WhatsApp social card
on:
  workflow_dispatch:
  push:
    paths:
      - social-card.svg
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick
      - name: Render WhatsApp-safe JPEG
        run: |
          rsvg-convert -w 1200 -h 630 social-card.svg -o social-card.png
          convert social-card.png -background "#f5f3ed" -alpha remove -alpha off -strip -sampling-factor 4:2:0 -quality 82 social-card-whatsapp.jpg
          ls -lh social-card-whatsapp.jpg
      - name: Commit rendered card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social-card-whatsapp.jpg
          git diff --cached --quiet || git commit -m "Render WhatsApp social card"
          git push
