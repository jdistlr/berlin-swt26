<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Snowflake World Tour Berlin Venue Map</title><desc id="d">Venue overview with Tracks 1 to 6, Tiny House Village, Snowflake Village, Expo Area, Expo Stage, registration, wardrobe and chill out meeting zone.</desc>
<style>
.bg{fill:#29b5e8}.card{fill:#fff}.zone{fill:#29b5e8;stroke:#17658a;stroke-width:5}.soft{fill:#75cae8}.line{fill:none;stroke:#17658a;stroke-width:5}.label{fill:#fff;font:700 19px Arial,sans-serif;text-anchor:middle}.small{fill:#fff;font:700 16px Arial,sans-serif;text-anchor:middle}.title{fill:#fff;font:800 72px Arial,sans-serif;text-anchor:middle}.brand{fill:#fff;font:800 31px Arial,sans-serif}.icon{fill:none;stroke:#fff;stroke-width:8;stroke-linecap:round}
</style>
